<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a12">
  <meta name="description" content="Anonymous messages through the void - Send and receive anonymous messages from strangers">
  <title>ECHO - Anonymous messages through the void</title>

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sendecho.app/">
  <meta property="og:title" content="ECHO - Anonymous messages through the void">
  <meta property="og:description" content="Cast a signal into the cosmos. Discover messages from other wanderers. Anonymous. Timeless. Human.">
  <meta property="og:image" content="https://sendecho.app/icon-512.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ECHO - Anonymous messages through the void">
  <meta name="twitter:description" content="Cast a signal into the cosmos. Discover messages from other wanderers. Anonymous. Timeless. Human.">
  <meta name="twitter:image" content="https://sendecho.app/icon-512.png">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
  <link rel="apple-touch-icon" href="/icon-180.png">

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Echo">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <!-- Styles — keep ?v= in sync with APP_VERSION in sw.js -->
  <link rel="stylesheet" href="/style.css?v=20">
</head>
<body>
  <!-- Stars background with multiple layers -->
  <div class="stars-container" id="stars-container">
    <div class="stars stars-layer-1" id="stars-layer-1"></div>
    <div class="stars stars-layer-2" id="stars-layer-2"></div>
    <div class="stars stars-layer-3" id="stars-layer-3"></div>
  </div>

  <!-- Top bar with controls -->
  <div class="top-bar">
    <select class="select-mini" id="theme-select" title="Theme">
      <option value="cosmos">🌌 Cosmos</option>
      <option value="ocean">🌊 Ocean</option>
      <option value="aurora">🌈 Aurora</option>
    </select>
    <select class="select-mini" id="lang-select" title="Language">
      <option value="en">EN</option>
      <option value="fr">FR</option>
      <option value="es">ES</option>
      <option value="de">DE</option>
      <option value="it">IT</option>
      <option value="pt">PT</option>
      <option value="nl">NL</option>
      <option value="ru">RU</option>
      <option value="ja">日本</option>
      <option value="ko">한국</option>
      <option value="zh">中文</option>
      <option value="ar">عربي</option>
    </select>
    <button class="sound-toggle" id="sound-toggle" title="Toggle sound" aria-label="Toggle sound">
      <svg id="sound-icon-on" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
      <svg id="sound-icon-off" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none;">
        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
      </svg>
    </button>
  </div>

  <!-- Main content -->
  <div class="container">
    <header class="header">
      <h1 class="title">ECHO</h1>
      <p class="subtitle">Anonymous messages through the void</p>
    </header>

    <div class="main-content">
      <!-- Home Section (landing page) -->
      <div class="section active" id="section-home">
        <p class="home-intro">Cast a signal into the cosmos. Discover messages from other wanderers. Anonymous. Timeless. Human.</p>
        <div class="home-buttons" role="group" aria-label="Main actions">
          <button class="btn-pill" id="btn-go-send" aria-label="Send a signal into the void">Send a Signal</button>
          <button class="btn-link" id="btn-go-receive" aria-label="Receive a signal from a stranger">Receive a Signal</button>
        </div>
        <p class="home-stats" id="home-stats"></p>
        <p class="personal-stats" id="personal-stats"></p>
      </div>

      <!-- Send Section -->
      <div class="section" id="section-send">
        <h2 class="section-title">Transmit to the void</h2>
        <form class="send-form glass" id="send-form">
          <label for="message-input" class="visually-hidden">Your message to the universe</label>
          <textarea
            id="message-input"
            placeholder="What do you want to transmit to the universe?"
            maxlength="140"
            aria-describedby="char-counter"
          ></textarea>
          <div class="char-counter" id="char-counter" role="status" aria-live="polite">0 / 140</div>
          <button type="submit" class="btn btn-primary" id="btn-send" aria-label="Transmit your message">Transmit</button>
        </form>
        <button class="btn btn-ghost btn-back" id="btn-back-send">← Back</button>
      </div>

      <!-- Receive Section -->
      <div class="section" id="section-receive">
        <div class="receive-section">
          <h2 class="section-title">Listen to the void</h2>
          <p class="receive-intro" id="receive-intro">Discover a signal from a stranger.</p>
          <button class="btn btn-primary" id="btn-receive" aria-label="Receive a signal from the void">Receive a signal</button>

          <div class="message-display" id="message-display" aria-live="polite" aria-atomic="true">
            <div class="message-label">Signal from a stranger</div>
            <p class="message-content" id="message-content"></p>
            <p class="message-date" id="message-date"></p>
            <div class="message-actions" id="message-actions" style="display: none;">
              <button class="btn-report" id="btn-report" aria-label="Report this message">Report</button>
              <span></span>
            </div>
          </div>

          <button class="btn btn-primary btn-another" id="btn-another" style="display: none;" aria-label="Receive another signal">Receive another</button>
          <button class="btn btn-ghost" id="btn-new-signal" aria-label="Send a new signal">Send a signal</button>
          <button class="btn btn-ghost btn-back" id="btn-back-receive">← Back</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-text">Somewhere, someone is listening</span>
    <span class="app-version" id="app-version"></span>
  </footer>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Application JavaScript — keep ?v= in sync with APP_VERSION in sw.js -->
  <script src="/app.js?v=20"></script>
</body>
</html>
